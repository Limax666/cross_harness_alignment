[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-harness-sft"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["httpx>=0.27", "PyYAML>=6.0", "mcp>=2.1,<3", "fastapi>=0.115", "uvicorn>=0.30", "anyio>=4.0"]

[project.scripts]
chsft-collect = "cross_harness_sft.collect_native:main"
chsft-collect-native = "cross_harness_sft.collect_native:main"
chsft-verify = "cross_harness_sft.verify:main"
chsft-build-rft = "cross_harness_sft.build_rft:main"
chsft-train = "cross_harness_sft.train_student:main"
chsft-benchmark-worker = "cross_harness_sft.benchmark_server:main"
chsft-compare-models = "cross_harness_sft.compare_models:main"
chsft-preflight = "cross_harness_sft.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]
